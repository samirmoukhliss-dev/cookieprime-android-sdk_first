// build.gradle (Groovy DSL)

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'

android {
    namespace 'com.cookieprime.consent'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        buildConfigField "String", "SDK_VERSION", "\"${versionName}\""
        buildConfigField "String", "SDK_NAME", "\"CookiePrimeConsentSDK\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas".toString(),
                    "room.incremental": "true",
                    "room.expandProjection": "true"
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Material Design
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Security Crypto
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // JSON Processing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Auto-initialization
    implementation 'androidx.startup:startup-runtime:1.1.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'io.mockk:mockk:1.13.5'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.work:work-testing:2.8.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
}

task checkAarResources {
    doLast {
        def aarFile = file("${buildDir}/outputs/aar/${project.name}-release.aar")
        if (aarFile.exists()) {
            println "✅ AAR file exists: ${aarFile.path}"
            println "Size: ${aarFile.length()} bytes"

            def tempDir = new File(buildDir, "temp/aar-check")
            tempDir.deleteDir()
            tempDir.mkdirs()

            copy {
                from zipTree(aarFile)
                into tempDir
            }

            def requiredFiles = [
                "AndroidManifest.xml",
                "classes.jar",
                "res/layout/activity_consent.xml",
                "res/layout/item_category.xml",
                "res/values/strings.xml",
                "res/values/colors.xml",
                "res/values/themes.xml",
                "res/values/attrs.xml"
            ]

            println "\n=== CHECKING AAR CONTENTS ==="
            requiredFiles.each { requiredFile ->
                def targetFile = new File(tempDir, requiredFile)
                if (targetFile.exists()) {
                    println "  ✅ Found: ${requiredFile}"
                } else {
                    println "  ❌ MISSING: ${requiredFile}"
                }
            }

            println "\n=== ALL RESOURCES IN AAR ==="
            def resourceCount = 0
            fileTree(tempDir).visit { details ->
                if (!details.file.directory && details.file.path.contains("res/")) {
                    println "  📄 ${details.relativePath}"
                    resourceCount++
                }
            }
            println "\nTotal resources: ${resourceCount}"

        } else {
            println "❌ AAR file not found at: ${aarFile.path}"
        }
    }
}

task verifyOneLineEntry {
    doLast {
        def sourcesDir = file("src/main/java/com/cookieprime")
        if (sourcesDir.exists()) {
            println "✅ One-line entry point directory exists: ${sourcesDir.path}"

            def requiredFiles = [
                "CookiePrime.kt",
                "consent/initializer/CookiePrimeInitializer.kt",
                "consent/ApplicationExt.kt"
            ]

            requiredFiles.each { requiredFile ->
                def targetFile = new File(sourcesDir, requiredFile)
                if (targetFile.exists()) {
                    println "  ✅ Found: $requiredFile"
                } else {
                    println "  ❌ MISSING: $requiredFile"
                }
            }
        } else {
            println "❌ One-line entry point directory missing!"
        }
    }
}

afterEvaluate {
    tasks.named("assembleRelease") {
        finalizedBy("checkAarResources", "verifyOneLineEntry")
    }
}